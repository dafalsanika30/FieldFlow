server:
  port: 8080

spring:
  application:
    name: fieldflow

  datasource:
    url: jdbc:mysql://localhost:3306/fieldflow_db
    username: root
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:replace-with-a-long-secret-key-of-at-least-32-characters}